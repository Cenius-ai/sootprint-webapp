[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sootprint"
version = "1.0.0"
description = "Chimney sweep log, flue condition chart and creosote risk score - one standard-library Python file."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sootprint" }]
keywords = ["chimney", "sweep", "creosote", "flue", "cli", "log"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities",
]
# No runtime dependencies: argparse, json, datetime, pathlib, os, sys, tempfile.
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
sootprint = "sootprint:main"

[project.urls]
Documentation = "https://example.invalid/sootprint"

[tool.setuptools]
py-modules = ["sootprint"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# DTZ011: the recency maths deliberately measures against the local calendar
# date, which is the day the household actually last had its chimney swept.
ignore = ["DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
